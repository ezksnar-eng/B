function applyTheme(name){
  const t = THEMES[name]; if(!t) return;
  const r = document.documentElement.style;
  r.setProperty('--bg', t.bg); r.setProperty('--bg-rgb', t.bgRgb); r.setProperty('--bg-alt', t.bgAlt);
  r.setProperty('--card', t.card); r.setProperty('--card-rgb', t.cardRgb); r.setProperty('--card2', t.card2);
  r.setProperty('--text', t.text); r.setProperty('--text-dim', t.textDim);
  r.setProperty('--line', t.line); r.setProperty('--line-strong', t.lineStrong);
  r.setProperty('--accent', t.accent); r.setProperty('--accent-rgb', t.accentRgb); r.setProperty('--accent-soft', t.accentSoft); r.setProperty('--on-accent', t.onAccent);
  r.setProperty('--secondary', t.secondary); r.setProperty('--secondary-rgb', t.secondaryRgb);

function fmtCountdown(ms){
  if(ms<=0) return 'متاحة الآن';
  const h = Math.floor(ms/3600000), d=Math.floor(h/24), rh=h%24, m=Math.floor((ms%3600000)/60000);
  if(d>0) return `خلال ${d} يوم ${rh} س`;
  if(h>0) return `خلال ${h} س ${m} د`;
  return `خلال ${m} دقيقة`;
}

  const box=document.getElementById('chatBox');
  const displayName = currentUser ? (currentUser.displayName || currentUser.email.split('@')[0]) : 'زائر';
  box.insertAdjacentHTML('beforeend', renderCommentRow({text:val, displayName, uid:currentUser?currentUser.id:null, avatarUrl:myAvatarUrl}, true));

function openReportFlow(type, targetId, targetLabel, extra){

async function submitReport(){

  if(!selectedReportReason){ msg.className='auth-msg err'; msg.textContent='اختر سبب البلاغ أولاً'; return; }

    const other = document.getElementById('reportOtherText').value.trim();

  }

  if(!fbReady){ msg.className='auth-msg err'; msg.textContent='تعذر الاتصال بالخادم'; return; }
  try{
    await window.fb.addDoc(window.fb.collection(window.fbDb,'reports'), {
      type: ctx.type, targetId: ctx.targetId||'', targetLabel: ctx.targetLabel||'',
      authorUid: ctx.authorUid || null, mangaKey: ctx.mangaKey || null, chapterNum: ctx.chapterNum ?? null,

    });

let readDirection = 'rtl';

let streamLoadedUpTo = 0;
let readerLang = 'ar';

async function translateText(text, targetLang){
  try{
    const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
    const data = await res.json();
    return data[0].map(chunk=>chunk[0]).join('');
  }catch(e){ return text; }
}
async function renderChapterBlock(container, n, chData, a){
  const divider = document.createElement('div');
  divider.className = 'chap-divider';
  divider.innerHTML = `<span>دخلت الفصل رقم ${n}</span>`;
  container.appendChild(divider);
  if(a.type === 'novel'){
    const p = document.createElement('div');
    p.className = 'reader-para';
    p.style.fontSize = novelFontSize+'px';
    const original = (chData && chData.text) ? chData.text : NOVEL_SAMPLE;
    p.textContent = readerLang==='ar' ? original : '...جاري الترجمة';
    container.appendChild(p);
    if(readerLang!=='ar'){
      const cacheKey = 'en';
      if(chData && chData['text_'+cacheKey]) p.textContent = chData['text_'+cacheKey];
      else{ const t = await translateText(original, readerLang); if(chData) chData['text_'+cacheKey]=t; p.textContent = t; }
    }
  } else {
    const pages = (readerLang==='en' && chData && Array.isArray(chData.pages_en) && chData.pages_en.length) ? chData.pages_en
      : (chData && Array.isArray(chData.pages) ? chData.pages : []);
    if(readerLang==='en' && chData && (!chData.pages_en || !chData.pages_en.length)){
      const note = document.createElement('div');
      note.style.cssText = 'font-size:11px;color:var(--text-dim);text-align:center;padding:6px 0;';
      note.textContent = 'ماكو نسخة إنجليزية لهذا الفصل بعد — يظهر بالعربي';
      container.appendChild(note);
    }
    if(pages.length){
      pages.forEach(url=>{
        const pg = document.createElement('div');
        pg.className = 'reader-page';
        pg.innerHTML = `<img src="${url}" loading="lazy" style="width:100%; display:block;">`;
        container.appendChild(pg);
      });
    } else {
      for(let i=1;i<=4;i++){
        const pg = document.createElement('div');
        pg.className = 'reader-page';
        pg.innerHTML = `<svg viewBox="0 0 24 24">${IC[a.icon]}</svg>`;
        container.appendChild(pg);
      }
    }
  }
}

async function fetchChapterData(mangaKey, n){
  if(!fbReady) return null;
  try{
    const {doc, getDoc, collection, query, where, limit, getDocs} = window.fb;
    let snap = await getDoc(doc(window.fbDb, 'mangas', mangaKey, 'chapters', String(n)));
    if(snap.exists()) return snap.data();
    const qSnap = await getDocs(query(collection(window.fbDb, 'mangas', mangaKey, 'chapters'), where('number','==',n), limit(1)));
    if(!qSnap.empty) return qSnap.docs[0].data();
  }catch(e){ console.error('تعذر تحميل الفصل:', e); }
  return null;
}
async function appendChapterToStream(n){
  const a = ANIME[currentAnimeKey];
  if(n>a.eps || streamLoadedUpTo>=n) return;
  streamLoadedUpTo = n;
  const stream = document.getElementById('readerStream');
  const chData = await fetchChapterData(currentAnimeKey, n);
  readerChapters.push({num:n, chData});
  await renderChapterBlock(stream, n, chData, a);
  if(!watchedEps[currentAnimeKey]) watchedEps[currentAnimeKey]=new Set();
  watchedEps[currentAnimeKey].add(n);
  updateReaderProgress();
  loadEpComments(currentAnimeKey, n);
}
function updateReaderProgress(){
  const a = ANIME[currentAnimeKey];
  const pct = Math.min(100, Math.round(streamLoadedUpTo/a.eps*100));
  document.getElementById('playerProgress').style.width = pct+'%';
}

function liveSearch(){
  const q=document.getElementById('liveSearchInput').value.trim();
  const box=document.getElementById('searchResults');
  const def=document.getElementById('searchDefault');
  const cat = document.querySelector('#searchCatTabs .search-chip.active').dataset.c;
  const sort = document.getElementById('sortSelect').value;
  if(!q){box.innerHTML=''; def.style.display='block'; return;}
  def.style.display='none';
  if(!recentSearches.includes(q)) recentSearches.push(q);
  let keys=[];
  if(cat==='all' || cat==='anime') keys = Object.keys(ANIME).filter(k=>ANIME[k].title.includes(q));
  if(sort==='rating') keys.sort((a,b)=>ANIME[b].rating-ANIME[a].rating);
  if(sort==='name') keys.sort((a,b)=>ANIME[a].title.localeCompare(ANIME[b].title,'ar'));
  let mangaHtml='', teamHtml='';
  if(cat==='all' || cat==='manga'){ const mm=getMangaList().filter(m=>m.title.includes(q)); if(mm.length) mangaHtml = mm.map(m=>`<div class="fav-item-card" onclick="openAnimeDetails('${m.key}')"><div class="fav-item-cover">${svgIcon(m.icon)}</div><div class="fav-item-details"><div class="fav-item-title">${m.title}</div><div class="fav-item-sub">${m.ch}</div></div></div>`).join(''); }
  if(cat==='all' || cat==='teams'){ const tt=TEAMS.filter(t=>t.name.includes(q)); if(tt.length) teamHtml = tt.map(t=>`<div class="team-card"><div class="team-ic">${svgIcon(t.icon)}</div><div class="team-info"><div class="team-name">${t.name}</div><div class="team-sub">${t.sub}</div></div></div>`).join(''); }
  const animeHtml = keys.length ? `<div class="grid-cards">${keys.map(renderCard).join('')}</div>` : '';
  const combined = animeHtml + mangaHtml + teamHtml;
  box.innerHTML = combined || `<div class="empty-state">${svgIcon('sparkle')}<div class="txt">ما لقينا نتائج لـ"${q}"</div></div>`;
}
